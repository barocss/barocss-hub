[package]
name = "barocss-hub-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

# Package renamed for D-033 (#35); the library keeps its Rust name.
[lib]
name = "hub_cli"

[[bin]]
name = "barocss-hub"
path = "src/main.rs"

[dependencies]
hub-core = { package = "barocss-hub-core", path = "../hub-core" }
sha2 = "0.10"
# Issue #46 R2: XOF for the LtHash16 digest (partial replicas, #47). Not
# on the wire path, so optional and off by default (#50).
blake3 = { version = "=1.8.2", optional = true }

[features]
lthash = ["dep:blake3"]
# Issue #57: compiles in the `HUB_TEST_*` environment hooks (crash points,
# logs, limits, timeouts). Test-only: enabled for this crate's own tests via
# the self dev-dependency below; release/dist builds never enable it.
test-hooks = []

[dev-dependencies]
proptest = "1"
# Issue #31: the eager checkpoint decode oracle (test-only).
hub-core = { package = "barocss-hub-core", path = "../hub-core", features = ["oracle"] }
# Issue #57: tests (and the binary they run) get the HUB_TEST_* hooks.
barocss-hub-cli = { path = ".", features = ["test-hooks"] }
