[package]
name = "hub-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hub"
path = "src/main.rs"

[dependencies]
hub-core = { path = "../hub-core" }
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
# Issue #31: the eager checkpoint decode oracle (test-only).
hub-core = { path = "../hub-core", features = ["oracle"] }
